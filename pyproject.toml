[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-anki-builder"
version = "0.1.0"
description = "Japanese OCR to Anki deck builder"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "genanki>=0.13",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "natsort>=8.0.0",
  "mss>=9.0.0",
]

[project.scripts]
jp-anki-build = "jp_anki_builder.cli:app"

[project.optional-dependencies]
japanese_nlp = [
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
  "sudachipy>=0.6.10",
  "sudachidict_core>=20260116",
]
manga_ocr = [
  "manga-ocr>=0.1.14",
]
pdf = [
  "pdfplumber>=0.10.0",
  "pypdfium2>=4.0.0",
]
paddle = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
]
screen_capture = [
  "dxcam>=0.0.5",
]
realtime = [
  "PySide6>=6.6.0",
  "dxcam>=0.0.5",
  "mss>=9.0.0",
]
cbr = [
  "rarfile>=4.0",
]
epub = [
  "ebooklib>=0.18",
]
recommended = [
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
  "sudachipy>=0.6.10",
  "sudachidict_core>=20260116",
  "manga-ocr>=0.1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
